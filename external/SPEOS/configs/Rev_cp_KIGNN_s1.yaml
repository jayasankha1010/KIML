  name: Rev_cp_KIGNN_s1

# Generated by additional_experiments/revision_runs/make_configs.py - do not edit by hand.
# disease=cp  variant=KIGNN  seed=1
  input:
    adjacency: ["pathway", "covaries"]
    adjacency_field: ["name", "name"]
    tag: gt_cp
    use_expression: False
    datasets: ./extensions/datasets.json

  model:
    architecture: GeneNetwork
    mp:
       type: film
       n_layers: 2
    pre_mp:
      dim: 50
      n_layers: 5
    post_mp:
      dim: 50
      n_layers: 5

  crossval:
    mode: kfold
    n_folds: 5
    positive_only: True
    seed: 1

  inference:
    save_dir: ./results/
    save_sorted: True
    save_tsv: True

# These runs exist to produce per-gene rankings for the ablation tables; the
# biological consistency analyses belong to the main results, not here. Leaving
# the task list empty also avoids a hard failure: pathway, hpo_enrichment and
# go_enrichment all import speos.postprocessing.goea, which imports
# speos.postprocessing.lightgoea - an EMPTY, untracked directory in this repo,
# so it never reaches a fresh clone and the import can never succeed.
  pp:
    tasks: []
